name: GEN-Z diario

on:
  schedule:
    # 23:00 UTC de lunes a viernes = media hora después de GEDA, para no coincidir en Yahoo (00:00 en Madrid en invierno, 01:00 en verano).
    - cron: "05 08 * * 2-6"
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: geda-diario        # el mismo grupo que GEDA: nunca corren a la vez (comparten datos/ y Yahoo)
  cancel-in-progress: false

jobs:
  genz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar GEN-Z (reintenta una vez a los 30 min si Yahoo bloquea)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set +e
          python genz_diario.py; code=$?
          if [ $code -eq 2 ]; then
            echo "Yahoo ha fallado. Reintento dentro de 30 minutos..."
            sleep 1800
            python genz_diario.py; code=$?
          fi
          exit $code

      - name: Guardar resultados en el repo
        if: always()
        run: |
          git config user.name "genz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d salida ] && git add salida
          git add datos/divisas_cache.json datos/industrias_yahoo_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar"
          else
            git commit -m "GEN-Z diario $(date -u +%F)"
            git pull --rebase
            git push
          fi
