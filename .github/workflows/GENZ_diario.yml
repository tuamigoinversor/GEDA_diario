name: GEN-Z diario

on:
  schedule:
    # GitHub usa hora UTC: 08:25 UTC = 9:25 en invierno y 10:25 en verano (hora de Madrid),
    # media hora después de GEDA (07:55 UTC). De martes a sábado, como GEDA.
    - cron: '25 8 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: geda-diario        # el mismo grupo que GEDA: nunca corren a la vez
  cancel-in-progress: false

jobs:
  genz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular GEN-Z y enviar el correo (reintenta una vez a los 30 min si Yahoo bloquea)
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set +e
          python genz_diario.py; code=$?
          if [ $code -eq 2 ]; then
            echo "Yahoo ha fallado. Reintento dentro de 30 minutos..."
            sleep 1800
            python genz_diario.py; code=$?
          fi
          exit $code

      - name: Guardar el informe en el repositorio (carpeta informe_genz/)
        if: always()
        run: |
          git config user.name "genz-bot"
          git config user.email "genz-bot@users.noreply.github.com"
          for d in informe_genz salida datos; do [ -e "$d" ] && git add "$d"; done
          if ! git diff --cached --quiet; then
            git commit -m "Informe GEN-Z $(date -u +%F)"
            git pull --rebase
            git push
          fi

